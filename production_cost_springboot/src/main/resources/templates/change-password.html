<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Login: Set Password - Seagull Printers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #071727 0%, #0c2340 50%, #034b75 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .pwd-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .pwd-header {
            background: #0c2340;
            color: #ffffff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="pwd-card">
    <div class="pwd-header">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-3 mb-2" style="width:48px; height:48px; font-weight:800; font-size:1.4rem;">
            <i class="bi bi-key-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Set Your Permanent Password</h4>
        <p class="text-white-50 small mb-0">Seagull Printers Security Compliance</p>
    </div>
    <div class="p-4 p-md-5">
        <div class="alert alert-warning py-2 small mb-3">
            <i class="bi bi-exclamation-circle-fill me-1"></i>
            Welcome to Seagull Printers! Because this is your first time logging in, you must update your temporary initial password before proceeding.
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

        <form th:action="@{/users/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" class="form-control bg-light" th:value="${username}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">New Password *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="newPassword" class="form-control" placeholder="Min 6 characters" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Confirm New Password *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Re-type new password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-check2-circle me-1"></i> Save Password & Continue
            </button>
        </form>
    </div>
</div>
</body>
</html>
